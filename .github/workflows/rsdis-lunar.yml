name: RSDIS lunar exploration
on:
  push:
    branches: [main]
    paths:
      - "unidades-curriculares/rsdis/projeto/**"
      - ".github/workflows/rsdis-lunar.yml"
  pull_request:
    paths:
      - "unidades-curriculares/rsdis/projeto/**"
      - ".github/workflows/rsdis-lunar.yml"
  workflow_dispatch:
    inputs:
      viper:
        description: Validate the detailed Space ROS rover instead of the lightweight mission
        type: boolean
        default: false
permissions:
  contents: read

concurrency:
  group: rsdis-lunar-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: unidades-curriculares/rsdis/projeto

jobs:
  jazzy:
    if: github.event_name != 'workflow_dispatch' || !inputs.viper
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    timeout-minutes: 40
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      ROS_DOMAIN_ID: '42'
    steps:
      - uses: actions/checkout@v7
      - name: Install simulation dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y git git-lfs ros-jazzy-ros-gz ros-jazzy-cv-bridge ros-jazzy-xacro ros-jazzy-rosidl-default-generators ros-jazzy-visualization-msgs python3-opencv python3-numpy python3-colcon-common-extensions
      - name: Build ROS packages and run portable tests
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build
          source install/setup.bash
          python3 -m unittest discover -s tests -v
      - name: Check physical full-circle steering and translation
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          python3 scripts/check_drive_ros.py
      - name: Verify actual cameras and mission messages
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          python3 scripts/smoke_test_ros.py --timeout 240
      - name: Complete the compact mission without footprint overlaps
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          python3 scripts/smoke_test_ros.py --config src/rsdis_lunar/config/mission_small.json --complete-mission --dashboard --timeout 600
      - name: Save the compact console checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: compact-console-checkpoint
          path: |
            unidades-curriculares/rsdis/projeto/results/smoke_*/console_state.json
            unidades-curriculares/rsdis/projeto/results/smoke_*/camera_*.jpg
      - name: Complete the expanded map and recover from a rover failure
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          python3 scripts/create_scenarios.py --count 1 --output results/ci_scenarios
          python3 scripts/run_experiment_ros.py --config results/ci_scenarios/failure_00.json --strategy energy --wall-timeout 1400
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-integration-logs
          path: unidades-curriculares/rsdis/projeto/results/

  viper:
    if: github.event_name == 'workflow_dispatch' && inputs.viper
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    timeout-minutes: 35
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      ROS_DOMAIN_ID: '43'
    steps:
      - uses: actions/checkout@v7
      - name: Install detailed-rover dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y git git-lfs ros-jazzy-ros-gz ros-jazzy-cv-bridge ros-jazzy-xacro ros-jazzy-rosidl-default-generators ros-jazzy-visualization-msgs python3-opencv python3-numpy python3-colcon-common-extensions
      - name: Build and prepare the pinned upstream rover
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build
          source install/setup.bash
          python3 scripts/fetch_upstream.py --assets
          python3 -m unittest discover -s tests -p test_viper.py -v
          python3 scripts/prepare_viper.py --validate-sdf
      - name: Verify detailed-rover turning and translation
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          python3 scripts/check_drive_ros.py --model viper
      - name: Complete the detailed-rover compact mission
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          python3 scripts/smoke_test_ros.py --model viper --config src/rsdis_lunar/config/mission_small.json --complete-mission --dashboard --timeout 900
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: viper-integration-logs
          path: unidades-curriculares/rsdis/projeto/results/
