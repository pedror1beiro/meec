name: Linux ROS and Gazebo checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      viper:
        description: Also download and smoke-test the detailed Space ROS rover
        type: boolean
        default: false
jobs:
  jazzy:
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    timeout-minutes: 35
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      ROS_DOMAIN_ID: '42'
    steps:
      - uses: actions/checkout@v4
      - name: Install simulation dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y git git-lfs ros-jazzy-ros-gz ros-jazzy-cv-bridge ros-jazzy-xacro ros-jazzy-rosidl-default-generators ros-jazzy-visualization-msgs python3-opencv python3-numpy python3-colcon-common-extensions
      - name: Build ROS packages and run portable tests
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build
          source install/setup.bash
          python3 -m unittest discover -s tests -v
      - name: Check physical full-circle steering and translation
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          python3 scripts/check_drive_ros.py
      - name: Verify actual cameras and mission messages
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          python3 scripts/smoke_test_ros.py --timeout 240
      - name: Complete the compact mission without footprint overlaps
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          python3 scripts/smoke_test_ros.py --config src/rsdis_lunar/config/mission_small.json --complete-mission --dashboard --timeout 600
      - name: Complete the expanded map and recover from a rover failure
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          python3 scripts/create_scenarios.py --count 1 --output results/ci_scenarios
          python3 scripts/run_experiment_ros.py --config results/ci_scenarios/failure_00.json --strategy energy --wall-timeout 1000
      - name: Check the detailed rover on request
        if: github.event_name == 'workflow_dispatch' && inputs.viper
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          python3 scripts/fetch_upstream.py --assets
          python3 -m unittest discover -s tests -p test_viper.py -v
          python3 scripts/prepare_viper.py --validate-sdf
          python3 scripts/smoke_test_ros.py --model viper --timeout 240
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-integration-logs
          path: results/
